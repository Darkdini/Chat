<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ERMENTORNA</title>
  <link rel="stylesheet" href="/css/chat.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-sm">
      <svg viewBox="0 0 40 40" fill="none" class="logo-svg">
        <polygon points="20,2 38,11 38,29 20,38 2,29 2,11" stroke="url(#gs)" stroke-width="2" fill="none"/>
        <circle cx="20" cy="20" r="5" fill="url(#gs)"/>
        <defs>
          <linearGradient id="gs" x1="0" y1="0" x2="40" y2="40">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
      </svg>
      <span>ERMENTORNA</span>
    </div>
    <div class="online-badge"><span class="online-dot"></span><span id="online-count">0</span></div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
    </span>
    <input type="text" id="search-input" placeholder="Поиск по нику...">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>

  <nav class="nav-section">
    <button class="nav-item active" data-room="global" onclick="switchRoom('global')">
      <span class="nav-icon">🌐</span>
      <span class="nav-label">Мировой чат</span>
      <span class="nav-badge" id="global-badge" style="display:none"></span>
    </button>
  </nav>

  <div class="section-title">
    <span>Участники</span>
    <span class="users-count" id="users-count"></span>
  </div>
  <div class="users-list" id="users-list"></div>

  <div class="sidebar-footer">
    <div class="my-profile" id="my-profile-btn" onclick="openMyProfile()">
      <div class="avatar-sm" id="my-avatar"><span id="my-avatar-initial"></span></div>
      <div class="profile-info">
        <span class="profile-nick" id="my-nickname"></span>
        <span class="profile-status-text">● Онлайн</span>
      </div>
      <button class="settings-btn" title="Профиль">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
      </button>
    </div>
  </div>
</aside>

<!-- Overlay for mobile -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<main class="chat-main" id="chat-main">
  <header class="chat-header">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
    </button>
    <div class="chat-header-info" id="header-info">
      <div class="chat-header-avatar" id="header-avatar">🌐</div>
      <div>
        <div class="chat-header-name" id="header-name">Мировой чат</div>
        <div class="chat-header-sub" id="header-sub">Глобальный канал</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="view-profile-btn" onclick="viewCurrentProfile()" title="Профиль" style="display:none">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
      </button>
    </div>
  </header>

  <div class="messages-area" id="messages-area">
    <div class="welcome-banner" id="welcome-banner">
      <div class="welcome-icon">🌐</div>
      <h2>Мировой чат</h2>
      <p>Здесь собираются все. Общайся, делись, создавай.</p>
    </div>
  </div>

  <div class="typing-indicator" id="typing-indicator">
    <span class="typing-dots"><i></i><i></i><i></i></span>
    <span id="typing-text"></span>
  </div>

  <!-- Attachment preview -->
  <div class="attach-preview" id="attach-preview" style="display:none">
    <img id="attach-preview-img" src="" alt="">
    <button class="attach-remove" onclick="removeAttachment()">✕</button>
    <span id="attach-preview-name"></span>
  </div>

  <div class="chat-input-area">
    <div class="input-row">
      <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Прикрепить файл">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a3 3 0 00-3 3v4a5 5 0 0010 0V7a1 1 0 112 0v4a7 7 0 11-14 0V7a5 5 0 0110 0v4a3 3 0 11-6 0V7a1 1 0 012 0v4a1 1 0 102 0V7a3 3 0 00-3-3z" clip-rule="evenodd"/></svg>
      </button>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
      <div class="input-container">
        <textarea id="msg-input" placeholder="Написать сообщение..." rows="1" maxlength="2000"></textarea>
        <span class="char-count" id="char-count"></span>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
      </button>
    </div>
  </div>
</main>

<!-- PROFILE MODAL -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal('profile-modal')">✕</button>
    <div class="profile-modal-header">
      <div class="profile-avatar-big">
        <div class="avatar-big" id="modal-avatar">
          <span id="modal-avatar-initial"></span>
          <img id="modal-avatar-img" src="" alt="" style="display:none">
        </div>
        <button class="avatar-edit-btn" id="avatar-edit-btn" onclick="document.getElementById('avatar-input').click()">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
        </button>
        <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
      </div>
      <div class="profile-header-text">
        <h2 id="modal-nickname" contenteditable="false"></h2>
        <p id="modal-username" class="modal-username"></p>
        <div class="status-badge" id="modal-status-badge">● Онлайн</div>
      </div>
    </div>
    <div class="profile-bio-wrap">
      <label>О себе</label>
      <textarea id="modal-bio" placeholder="Расскажи о себе..." maxlength="200" readonly></textarea>
    </div>
    <div class="profile-stats" id="profile-stats">
      <div class="stat-item"><span class="stat-val" id="stat-messages">—</span><span class="stat-label">сообщений</span></div>
      <div class="stat-item"><span class="stat-val" id="stat-joined">—</span><span class="stat-label">с нами</span></div>
    </div>
    <div class="profile-actions">
      <button class="btn-edit" id="edit-profile-btn" onclick="toggleEditProfile()">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
        Редактировать
      </button>
      <button class="btn-save" id="save-profile-btn" onclick="saveProfile()" style="display:none">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
        Сохранить
      </button>
      <button class="btn-dm" id="dm-btn" onclick="startDM()" style="display:none">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"/></svg>
        Написать
      </button>
      <button class="btn-logout" id="logout-btn" onclick="logout()">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/></svg>
        Выйти
      </button>
    </div>
  </div>
</div>

<!-- Image lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
